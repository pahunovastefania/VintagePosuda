# =====================================================================
# docker-compose для разработки и проверки развёртывания.
# Один сервис app (Blazor Server) + named volume для SQLite-базы.
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: src/VintagePosuda.Web/Dockerfile
    image: vintage-posuda:latest
    container_name: vintage-posuda
    ports:
      - "8080:8080"
    environment:
      # Переопределяем строку подключения, чтобы база лежала в volume.
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/app.db"
      AdminUser__Email: "${ADMIN_EMAIL:-admin@vintage.local}"
      AdminUser__Password: "${ADMIN_PASSWORD:-Admin123}"
      AdminUser__FullName: "${ADMIN_FULL_NAME:-Администратор}"
      ASPNETCORE_ENVIRONMENT: "Production"
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app-data:
    driver: local
